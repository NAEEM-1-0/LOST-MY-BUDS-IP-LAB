<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="caseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="caseBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="cShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#0f172a" rx="16"/>
  <circle cx="200" cy="200" r="170" fill="url(#caseGlow)"/>

  <g filter="url(#cShadow)">
    <!-- Case Lower Body -->
    <rect x="110" y="150" width="180" height="130" rx="36" fill="url(#caseBody)"/>
    <!-- Case Lid -->
    <rect x="110" y="110" width="180" height="42" rx="20" fill="#f8fafc"/>
    <!-- Lid Seam Cut -->
    <line x1="110" y1="151" x2="290" y2="151" stroke="#cbd5e1" stroke-width="2"/>
    <!-- LED Indicator (Green) -->
    <circle cx="200" cy="185" r="4.5" fill="#10b981"/>
    <circle cx="200" cy="185" r="8" fill="#10b981" fill-opacity="0.3"/>
    <!-- USB-C Port Cutout -->
    <rect x="185" y="276" width="30" height="4" rx="2" fill="#94a3b8"/>
    <!-- Speaker Holes (AirPods Pro 2) -->
    <circle cx="160" cy="275" r="2" fill="#94a3b8"/>
    <circle cx="168" cy="275" r="2" fill="#94a3b8"/>
    <circle cx="232" cy="275" r="2" fill="#94a3b8"/>
    <circle cx="240" cy="275" r="2" fill="#94a3b8"/>
  </g>

  <!-- Tag Pill -->
  <rect x="24" y="24" width="100" height="26" rx="6" fill="#0369a1" fill-opacity="0.3"/>
  <text x="74" y="41" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">MagSafe Case</text>
  <text x="350" y="42" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10b981" text-anchor="middle">⚡ USB-C</text>
</svg>