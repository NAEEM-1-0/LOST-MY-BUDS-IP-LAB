<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="sncGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sncBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <filter id="sncShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#f59e0b" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#0f172a" rx="16"/>
  <circle cx="200" cy="200" r="160" fill="url(#sncGlow)"/>

  <g filter="url(#sncShadow)">
    <!-- Case Lower Body -->
    <rect x="110" y="160" width="180" height="110" rx="28" fill="url(#sncBody)" stroke="#3f3f46" stroke-width="2"/>
    <!-- Lid with Gold Sony Logo -->
    <rect x="110" y="115" width="180" height="45" rx="20" fill="#27272a" stroke="#3f3f46" stroke-width="2"/>
    <text x="200" y="145" font-family="sans-serif" font-size="14" font-weight="bold" fill="#d97706" letter-spacing="4" text-anchor="middle">SONY</text>
    <!-- LED Strip -->
    <rect x="180" y="185" width="40" height="5" rx="2.5" fill="#f59e0b"/>
  </g>

  <rect x="24" y="24" width="95" height="26" rx="6" fill="#78350f" fill-opacity="0.4"/>
  <text x="71" y="41" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle">Sony Case</text>
  <text x="350" y="42" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f59e0b" text-anchor="middle">LDAC OEM</text>
</svg>