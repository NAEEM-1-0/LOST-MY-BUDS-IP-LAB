<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="gcGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gcBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="gcShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#8b5cf6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#0f172a" rx="16"/>
  <circle cx="200" cy="200" r="160" fill="url(#gcGlow)"/>

  <g filter="url(#gcShadow)">
    <!-- Clamshell Square-Round Box -->
    <rect x="120" y="120" width="160" height="160" rx="32" fill="url(#gcBody)" stroke="#475569" stroke-width="2"/>
    <!-- Lid Cut Line -->
    <rect x="120" y="196" width="160" height="4" fill="#0f172a"/>
    <!-- Samsung Logo Impression -->
    <text x="200" y="165" font-family="sans-serif" font-size="14" font-weight="bold" fill="#94a3b8" letter-spacing="3" text-anchor="middle">SAMSUNG</text>
    <text x="200" y="180" font-family="sans-serif" font-size="8" font-weight="bold" fill="#64748b" letter-spacing="1" text-anchor="middle">Sound by AKG</text>
    <!-- LED -->
    <circle cx="200" cy="225" r="4" fill="#10b981"/>
    <circle cx="200" cy="225" r="8" fill="#10b981" fill-opacity="0.3"/>
  </g>

  <rect x="24" y="24" width="110" height="26" rx="6" fill="#4c1d95" fill-opacity="0.4"/>
  <text x="79" y="41" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="middle">Wireless Case</text>
  <text x="350" y="42" font-family="sans-serif" font-size="13" font-weight="bold" fill="#10b981" text-anchor="middle">AKG OEM</text>
</svg>