<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="pxGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pxCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="pxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0284c7" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#0f172a" rx="16"/>
  <circle cx="200" cy="200" r="160" fill="url(#pxGlow)"/>

  <g transform="translate(200, 200) scale(1, 1) translate(-200, -200)" filter="url(#pxShadow)">
    <!-- Charcoal Pill Cap (Touch Sensor) -->
    <ellipse cx="220" cy="200" rx="42" ry="50" fill="url(#pxCap)" stroke="#64748b" stroke-width="2"/>
    <!-- Iconic Google 'G' Tone -->
    <circle cx="220" cy="200" r="14" fill="#0f172a"/>
    <text x="220" y="206" font-family="sans-serif" font-size="16" font-weight="bold" fill="#38bdf8" text-anchor="middle">G</text>

    <!-- Inner Nozzle with Ear Tip -->
    <path d="M 178 175 C 130 170, 130 230, 178 225 Z" fill="#0f172a"/>
    <ellipse cx="145" cy="200" rx="10" ry="18" fill="#334155"/>
    <text x="195" y="205" font-family="sans-serif" font-size="14" font-weight="bold" fill="#94a3b8">L</text>
  </g>

  <rect x="24" y="24" width="100" height="26" rx="6" fill="#0369a1" fill-opacity="0.3"/>
  <text x="74" y="41" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Google Pixel</text>
  <text x="350" y="42" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">L</text>
</svg>