<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="ntGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="ntShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#ffffff" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#0f172a" rx="16"/>
  <circle cx="200" cy="200" r="160" fill="url(#ntGlow)"/>

  <g transform="translate(200, 200) scale(1, 1) translate(-200, -200)" filter="url(#ntShadow)">
    <!-- Transparent Stem -->
    <rect x="210" y="170" width="28" height="130" rx="14" fill="#ffffff" fill-opacity="0.2" stroke="#ffffff" stroke-width="2"/>
    <!-- Internal Circuit Board Elements -->
    <rect x="218" y="185" width="12" height="70" rx="4" fill="#09090b"/>
    <circle cx="224" cy="200" r="2.5" fill="#ef4444"/> <!-- Red dot signature -->
    <circle cx="224" cy="220" r="2" fill="#e2e8f0"/>
    <circle cx="224" cy="240" r="2" fill="#e2e8f0"/>
    <text x="224" y="275" font-family="monospace" font-size="7" fill="#a1a1aa" text-anchor="middle">(2)</text>

    <!-- White Head Unit -->
    <ellipse cx="180" cy="160" rx="48" ry="44" fill="#ffffff"/>
    <ellipse cx="140" cy="160" rx="14" ry="20" fill="#e2e8f0"/>
    <!-- Letter -->
    <text x="180" y="166" font-family="monospace" font-size="16" font-weight="bold" fill="#09090b" text-anchor="middle">L</text>
  </g>

  <rect x="24" y="24" width="105" height="26" rx="6" fill="#27272a"/>
  <text x="76" y="41" font-family="monospace" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">NOTHING (2)</text>
  <text x="350" y="42" font-family="monospace" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">L</text>
</svg>