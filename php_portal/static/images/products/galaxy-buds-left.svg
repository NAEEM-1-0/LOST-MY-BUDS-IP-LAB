<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="galGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="galBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="gShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#8b5cf6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#0f172a" rx="16"/>
  <circle cx="200" cy="200" r="160" fill="url(#galGlow)"/>

  <g transform="translate(200, 200) scale(1, 1) translate(-200, -200)" filter="url(#gShadow)">
    <!-- Aerodynamic Pebble Body -->
    <path d="M 140 180 C 130 130, 240 110, 260 170 C 275 220, 210 270, 160 250 C 135 240, 145 205, 140 180 Z" fill="url(#galBody)" stroke="#475569" stroke-width="2"/>
    <!-- Glossy Touch Surface -->
    <ellipse cx="215" cy="175" rx="36" ry="46" fill="#1e293b" fill-opacity="0.8"/>
    <!-- Mic Grille Top -->
    <ellipse cx="230" cy="140" rx="5" ry="3" fill="#64748b"/>
    <!-- Mic Grille Bottom -->
    <ellipse cx="220" cy="225" rx="5" ry="3" fill="#64748b"/>
    <!-- Silicone Tip -->
    <path d="M 145 170 C 120 165, 120 195, 145 200 Z" fill="#0f172a"/>
    <!-- Charging Contacts -->
    <circle cx="170" cy="210" r="3.5" fill="#f59e0b"/>
    <circle cx="180" cy="218" r="3.5" fill="#f59e0b"/>
    <!-- Letter mark -->
    <text x="215" y="180" font-family="sans-serif" font-size="16" font-weight="bold" fill="#94a3b8" text-anchor="middle">L</text>
  </g>

  <rect x="24" y="24" width="110" height="26" rx="6" fill="#4c1d95" fill-opacity="0.4"/>
  <text x="79" y="41" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="middle">Samsung OEM</text>
  <text x="350" y="42" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">L</text>
</svg>