<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="400" height="400" fill="#0f172a" rx="16"/>
  <circle cx="200" cy="200" r="160" fill="url(#bgGlow)"/>

  <!-- Earbud Body -->
  <g transform="translate(200, 200) scale(0.95, 0.95) translate(-200, -200)" filter="url(#shadow)">
    <!-- Stem -->
    <rect x="208" y="180" width="26" height="120" rx="13" fill="url(#stemGrad)"/>
    <!-- Stem Chrome Tip -->
    <rect x="208" y="286" width="26" height="14" rx="7" fill="#94a3b8"/>
    <!-- Force Sensor Indent -->
    <rect x="206" y="225" width="4" height="28" rx="2" fill="#94a3b8"/>
    <!-- Microphone Mesh on Stem -->
    <rect x="230" y="275" width="3" height="10" rx="1.5" fill="#334155"/>

    <!-- Head Ball -->
    <ellipse cx="180" cy="165" rx="52" ry="46" fill="url(#bodyGrad)"/>
    <!-- Acoustic Vent Mesh -->
    <ellipse cx="195" cy="145" rx="12" ry="6" fill="#1e293b"/>
    <!-- Inner Sensor -->
    <circle cx="155" cy="165" r="4" fill="#0f172a"/>

    <!-- Ear Tip (Soft Silicone) -->
    <path d="M 140 140 C 115 150, 115 180, 140 190 Z" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="130" cy="165" rx="8" ry="16" fill="#cbd5e1"/>
    
    <!-- L / R text -->
    <text x="215" y="210" font-family="sans-serif" font-size="12" font-weight="bold" fill="#64748b" transform="scale(1, 1) translate(0, 0)">L</text>
  </g>

  <!-- Tag Pill in SVG -->
  <rect x="24" y="24" width="90" height="26" rx="6" fill="#0369a1" fill-opacity="0.3"/>
  <text x="69" y="41" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Apple OEM</text>
  <text x="350" y="42" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">L</text>
</svg>